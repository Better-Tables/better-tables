# Pin the classic hoisted node_modules layout. Bun >=1.3's isolated linker
# (.bun store + per-package symlinks) races its own re-linking against
# turbo-spawned `bun run` tasks: tsc resolving workspace deps through the
# symlinks mid-relink sees ENOENT and fails typecheck with bogus TS2307s
# (diagnosed 2026-07-13; see plans/README.md "infra" note). Remove only after
# verifying `bunx turbo run typecheck --force` is green twice in a row on a
# bun version with the isolated linker.
[install]
linker = "hoisted"
