name: PR Title Lint

# semantic-release derives each package's version bump from Conventional
# Commits. Direct commits on main are linted at commit time by commitlint
# (.husky/commit-msg), but PRs merged via squash use the PR title as the
# resulting commit message on main, so that title has to be validated too.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
