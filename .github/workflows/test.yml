name: Test Suite

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/core/**'
      - 'packages/adapters/**'
      - 'packages/ui/**'
      - 'packages/cli/**'
      - 'apps/marketing/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/test.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/core/**'
      - 'packages/adapters/**'
      - 'packages/ui/**'
      - 'packages/cli/**'
      - 'apps/marketing/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/test.yml'

env:
  NODE_VERSION: '22'

jobs:
  build-core:
    name: Build Core Package (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Core Package
        run: bun run build --filter=@better-tables/core

      - name: Upload Core build artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
          retention-days: 1

  static-checks:
    name: Typecheck & Lint (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test marketing data layer
        run: bun test
        working-directory: apps/marketing

      - name: Lint (check only)
        run: bunx biome check .

  test-core:
    name: Test Core Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "Installing dependencies from workspace root..."
          cd ../..
          bun install --frozen-lockfile
          echo ""
          echo "✓ Dependencies installed successfully"
          echo "Workspace packages:"
          bun pm ls 2>/dev/null | head -20 || echo "Package list command not available"

      - name: Run Core Tests
        run: |
          echo "========================================="
          echo "🧪 Running Core Package Tests"
          echo "========================================="
          echo ""
          echo "Working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "Bun version: $(bun --version)"
          echo ""
          echo "Starting test execution..."
          echo ""
          echo "Running: bun test"
          echo ""
          bun test
          echo ""
          echo "========================================="
          echo "✅ Core tests completed successfully"
          echo "========================================="

  test-cli:
    name: Test CLI Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "Installing dependencies from workspace root..."
          cd ../..
          bun install --frozen-lockfile
          echo ""
          echo "✓ Dependencies installed successfully"
          echo "Workspace packages:"
          bun pm ls 2>/dev/null | head -20 || echo "Package list command not available"

      - name: Run CLI Tests
        run: |
          echo "========================================="
          echo "🧪 Running CLI Package Tests"
          echo "========================================="
          echo ""
          echo "Working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "Bun version: $(bun --version)"
          echo ""
          echo "Starting test execution..."
          echo ""
          echo "Running: bun test"
          echo ""
          bun test
          echo ""
          echo "========================================="
          echo "✅ CLI tests completed successfully"
          echo "========================================="

  test-ui:
    name: Test UI Package
    runs-on: ubuntu-latest
    needs: build-core
    defaults:
      run:
        working-directory: packages/ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "Installing dependencies from workspace root..."
          cd ../..
          bun install --frozen-lockfile

      - name: Download Core build artifact
        uses: actions/download-artifact@v8
        with:
          name: core-dist
          path: packages/core/dist

      # Plan 043: UI integration tests import @better-tables/adapters-drizzle
      # (bun:sqlite fixture). Build toolkit + drizzle after restoring core dist.
      - name: Build adapter deps for UI integration tests
        run: |
          cd ../..
          bun run build --filter=@better-tables/adapters-toolkit --filter=@better-tables/adapters-drizzle

      - name: Run UI Tests
        run: bun test

  test-adapters:
    name: Test Adapter Packages
    runs-on: ubuntu-latest
    needs: build-core
    defaults:
      run:
        working-directory: packages/adapters/drizzle
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: better_tables_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: drizzle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "Installing dependencies from workspace root..."
          cd ../../..
          bun install --frozen-lockfile
          echo ""
          echo "✓ Dependencies installed successfully"
          echo "Workspace packages:"
          bun pm ls 2>/dev/null | head -20 || echo "Package list command not available"

      - name: Download Core build artifact
        uses: actions/download-artifact@v8
        with:
          name: core-dist
          path: packages/core/dist

      - name: Build Toolkit (dependency)
        run: |
          echo "Building adapter toolkit dependency..."
          cd ../../..
          bun run build --filter=@better-tables/adapters-toolkit
          echo ""
          echo "Verifying builds..."
          ls -la packages/core/dist/ || echo "Warning: core dist not found"
          ls -la packages/adapters/toolkit/dist/ || echo "Warning: toolkit dist not found"
          echo "✓ Core (cached) and toolkit built successfully"

      - name: Run Adapter Tests
        env:
          CI: 'true'
          # Set connection strings for MySQL and Postgres services
          # Using root for MySQL since tests need to create databases
          MYSQL_TEST_URL: mysql://root:testpassword@localhost:3306
          POSTGRES_TEST_URL: postgresql://testuser:testpassword@localhost:5432/drizzle_test
        run: |
          echo "========================================="
          echo "🧪 Running Adapter Package Tests"
          echo "========================================="
          echo ""
          echo "Working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "Bun version: $(bun --version)"
          echo ""
          echo "Database services available:"
          echo "  MySQL: $MYSQL_TEST_URL"
          echo "  Postgres: $POSTGRES_TEST_URL"
          echo ""
          echo "Waiting for database services to be ready..."
          sleep 5
          echo ""
          echo "Starting test execution..."
          echo ""
          echo "Running: bun test"
          echo ""
          bun test
          echo ""
          echo "========================================="
          echo "✅ Adapter tests completed successfully"
          echo "========================================="

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-core, static-checks, test-core, test-cli, test-ui, test-adapters]
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "========================================="
          echo "📊 Test Execution Summary"
          echo "========================================="
          echo ""

          BUILD_CORE_RESULT="${{ needs.build-core.result }}"
          STATIC_RESULT="${{ needs.static-checks.result }}"
          CORE_RESULT="${{ needs.test-core.result }}"
          CLI_RESULT="${{ needs.test-cli.result }}"
          UI_RESULT="${{ needs.test-ui.result }}"
          ADAPTER_RESULT="${{ needs.test-adapters.result }}"

          if [ "$BUILD_CORE_RESULT" = "success" ]; then
            echo "Build Core (shared): ✅ PASSED"
          else
            echo "Build Core (shared): ❌ FAILED"
          fi

          if [ "$STATIC_RESULT" = "success" ]; then
            echo "Typecheck & Lint: ✅ PASSED"
          else
            echo "Typecheck & Lint: ❌ FAILED"
          fi

          if [ "$CORE_RESULT" = "success" ]; then
            echo "Core Package Tests: ✅ PASSED"
          else
            echo "Core Package Tests: ❌ FAILED"
          fi

          if [ "$CLI_RESULT" = "success" ]; then
            echo "CLI Package Tests: ✅ PASSED"
          else
            echo "CLI Package Tests: ❌ FAILED"
          fi

          if [ "$UI_RESULT" = "success" ]; then
            echo "UI Package Tests: ✅ PASSED"
          else
            echo "UI Package Tests: ❌ FAILED"
          fi

          if [ "$ADAPTER_RESULT" = "success" ]; then
            echo "Adapter Package Tests: ✅ PASSED"
          else
            echo "Adapter Package Tests: ❌ FAILED"
          fi

          echo ""
          echo "========================================="

          if [ "$BUILD_CORE_RESULT" != "success" ] || [ "$STATIC_RESULT" != "success" ] || [ "$CORE_RESULT" != "success" ] || [ "$CLI_RESULT" != "success" ] || [ "$UI_RESULT" != "success" ] || [ "$ADAPTER_RESULT" != "success" ]; then
            echo "❌ Some tests failed. Please check the logs above for details."
            exit 1
          else
            echo "✅ All tests passed successfully!"
          fi
          echo "========================================="
