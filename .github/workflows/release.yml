name: Release

# Runs after the Test Suite workflow succeeds on main, then releases each
# publishable package independently via semantic-release: version is
# computed from Conventional Commits scoped to that package's directory
# (packages/core, packages/cli, packages/adapters/drizzle,
# packages/adapters/toolkit), it's published to npm with `bun publish`
# (which resolves `workspace:*` deps to real semver), and a GitHub Release
# + CHANGELOG.md + tag are created to match.
#
# @better-tables/ui and apps/marketing are private and never released here.
on:
  workflow_run:
    workflows:
      - Test Suite
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release changed packages
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          # Skip husky's commit-msg hook install: CI commits (via
          # @semantic-release/git) shouldn't be linted the way local dev
          # commits are — commitlint is a developer safety net, not a
          # pipeline gate here.
          HUSKY: '0'
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release/run.sh
